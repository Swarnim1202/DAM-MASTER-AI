# Render Blueprint — deploys DAM MASTER AI (ASP.NET Core + React) + MySQL
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Web Service (backend + frontend combined) ────────────────────────────────
  - type: web
    name: dammaster-api
    runtime: docker
    dockerfilePath: ./DamMaster/Dockerfile
    dockerContext: ./DamMaster
    plan: free                    # upgrade to "starter" ($7/mo) for always-on
    healthCheckPath: /api/auth/me
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: Storage__Root
        value: /tmp/dammaster-files    # ephemeral on free tier; use a Disk for persistence
      # Individual MySQL vars — entrypoint.sh assembles the connection string at startup
      - key: MYSQLHOST
        fromDatabase:
          name: dammaster-db
          property: host
      - key: MYSQLPORT
        fromDatabase:
          name: dammaster-db
          property: port
      - key: MYSQLDATABASE
        fromDatabase:
          name: dammaster-db
          property: database
      - key: MYSQLUSER
        fromDatabase:
          name: dammaster-db
          property: user
      - key: MYSQLPASSWORD
        fromDatabase:
          name: dammaster-db
          property: password

  # ── MySQL 8 Database ──────────────────────────────────────────────────────────
databases:
  - name: dammaster-db
    databaseName: dammaster
    user: dammaster
    plan: free                    # 1 GB free; upgrade for production
